services:
  scan-app:
    build: .
    restart: always
    command: uvicorn src.app:app --host 0.0.0.0 --port 8005 --reload
    ports:
      - "8005:8005"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - /home/rudich/scan-files:/home/rudich/scan-files
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      UPLOADS_DIR: /app/uploads
      SCAN_FILES_DIR: /home/rudich/scan-files
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b

  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
