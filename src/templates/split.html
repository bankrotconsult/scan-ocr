<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Разбивка PDF — Банкротконсалт</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 32px; color: #111; }

    /* Upload */
    .upload-box {
      background: #fff; border: 2px dashed #ccc; border-radius: 12px;
      padding: 48px; text-align: center; cursor: pointer; transition: border-color .2s;
    }
    .upload-box:hover { border-color: #6366f1; }
    .upload-box input { display: none; }
    .upload-box label { cursor: pointer; font-size: 16px; color: #666; }
    .upload-box label span { color: #6366f1; font-weight: 600; }
    #file-name { margin-top: 12px; font-size: 14px; color: #888; }
    .btn {
      display: inline-block; padding: 10px 24px; border-radius: 8px; font-size: 15px;
      font-weight: 500; cursor: pointer; border: none; transition: background .2s;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-outline { background: #fff; color: #6366f1; border: 2px solid #6366f1; }
    .btn-outline:hover { background: #eef2ff; }
    #upload-btn { margin-top: 20px; }

    /* Viewer */
    #viewer-section { display: none; }
    .viewer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .viewer-header h2 { font-size: 18px; font-weight: 600; }
    .hint { font-size: 13px; color: #888; margin-top: 4px; }
    .selection-info { font-size: 14px; color: #6366f1; font-weight: 500; }

    .pages-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 28px; }
    .page-card {
      position: relative; cursor: pointer; border-radius: 8px;
      border: 3px solid transparent; transition: border-color .15s, box-shadow .15s;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }
    .page-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.18); }
    .page-card.selected { border-color: #6366f1; }
    .page-card canvas { display: block; border-radius: 6px; }
    .page-num {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
      padding: 2px 7px; border-radius: 10px; pointer-events: none;
    }
    .page-check {
      display: none; position: absolute; top: 6px; right: 6px;
      width: 22px; height: 22px; background: #6366f1; border-radius: 50%;
      align-items: center; justify-content: center; color: #fff; font-size: 13px;
    }
    .page-card.selected .page-check { display: flex; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 18px; height: 18px; border: 2px solid #fff;
      border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    #results-section { display: none; margin-top: 32px; }
    #results-section h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    th { background: #f9f9f9; text-align: left; padding: 12px 16px; font-size: 13px; color: #666; font-weight: 500; border-bottom: 1px solid #eee; }
    td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500;
    }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-done    { background: #d1fae5; color: #065f46; }
    .badge-error   { background: #fee2e2; color: #991b1b; }

    .actions { display: flex; gap: 12px; align-items: center; }
    #reset-btn { margin-top: 20px; }

    /* Loading overlay */
    #loading { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-size: 16px; color: #555; }
    #loading .big-spinner { width: 42px; height: 42px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }

    /* Modal nav buttons */
    .modal-nav {
      background: #f3f4f6; border: none; border-radius: 8px;
      padding: 6px 16px; font-size: 20px; cursor: pointer;
      color: #374151; transition: background .15s; line-height: 1; flex-shrink: 0;
    }
    .modal-nav:hover:not(:disabled) { background: #e5e7eb; }
    .modal-nav:disabled { opacity: .3; cursor: default; }

    /* Modal select toggle button */
    .modal-sel-btn {
      padding: 8px 20px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s, color .15s;
    }
  </style>
</head>
<body>
<header style="background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 24px;display:flex;align-items:center;gap:8px;">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="7" x2="21" y2="7"/>
    <path d="M3 7l3 8a3 3 0 006 0L3 7"/><path d="M21 7l-3 8a3 3 0 01-6 0L21 7"/>
    <line x1="9" y1="21" x2="15" y2="21"/>
  </svg>
  <span style="font-size:15px;font-weight:700;color:#6366f1;letter-spacing:.3px;">Банкротконсалт</span>
</header>
<div id="loading">
  <div class="big-spinner"></div>
  <span id="loading-text">Загрузка...</span>
</div>

<div class="container">
  <a href="/" style="display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:500;text-decoration:none;background:#6366f1;padding:8px 18px;border-radius:8px;margin-bottom:24px;">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    На главную
  </a>
  <h1>Разбивка и распознавание PDF</h1>

  <!-- Step 1: Upload -->
  <div id="upload-section">
    <div class="upload-box" onclick="document.getElementById('file-input').click()">
      <label>
        <svg width="40" height="40" fill="none" stroke="#ccc" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom:12px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4 4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg><br>
        Перетащите PDF или <span>выберите файл</span>
      </label>
      <input type="file" id="file-input" accept=".pdf" onchange="onFileSelected()">
      <div id="file-name"></div>
    </div>
    <div style="text-align:center">
      <button class="btn btn-primary" id="upload-btn" disabled onclick="uploadPDF()">Загрузить и открыть</button>
    </div>
  </div>

  <!-- Step 2: Viewer -->
  <div id="viewer-section">
    <div class="viewer-header">
      <div>
        <h2 id="viewer-title">Выберите страницы-разделители</h2>
        <div class="hint">Каждая выбранная страница станет началом нового сегмента</div>
      </div>
      <div class="actions">
        <button class="btn btn-outline" id="delete-btn" disabled onclick="deleteSelectedPages()">Удалить выбранные</button>
        <span class="selection-info" id="selection-info">Не выбрано</span>
        <button class="btn btn-primary" id="process-btn" disabled onclick="processSplit()">Разделить и обработать</button>
      </div>
    </div>
    <div class="pages-grid" id="pages-grid"></div>
  </div>

  <!-- Step 3: Results -->
  <div id="results-section">
    <h2>Созданные записи</h2>
    <table>
      <thead><tr><th>ID</th><th>Файл</th><th>Статус</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>
</div>

<!-- Scroll to top button -->
<button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  style="display:none;position:fixed;bottom:28px;right:28px;z-index:50;
         width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
         background:#6366f1;color:#fff;font-size:20px;line-height:1;
         box-shadow:0 4px 14px rgba(99,102,241,.4);transition:opacity .2s;"
  title="Наверх">↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Page zoom modal -->
<div id="page-modal"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;"
     onclick="onModalOverlayClick(event)">
  <div id="modal-box"
       style="position:relative;max-width:92vw;max-height:92vh;overflow:auto;background:#fff;border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);">

    <!-- Modal header: prev / page info / next / close -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <button class="modal-nav" id="modal-prev" onclick="navigateModal(-1)" title="Предыдущая (←)">‹</button>
      <span id="modal-page-num" style="flex:1;text-align:center;font-size:13px;color:#555;font-weight:500;"></span>
      <button class="modal-nav" id="modal-next" onclick="navigateModal(1)" title="Следующая (→)">›</button>
      <button onclick="closeModal()"
              style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:24px;line-height:1;padding:0 4px;margin-left:4px;">✕</button>
    </div>

    <canvas id="modal-canvas" style="display:block;"></canvas>

    <!-- Modal footer: select toggle / hint -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:12px;flex-wrap:wrap;">
      <button class="modal-sel-btn" id="modal-toggle-btn" onclick="toggleFromModal()">
        ✓ Добавить как разделитель
      </button>
      <span style="font-size:12px;color:#aaa;">← → для листания · Esc для закрытия</span>
    </div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfToken = null;
  let totalPages = 0;
  let pdfDoc = null;
  let longPressActive = false;
  let pressTimer = null;
  let currentModalPage = null;
  const selectedPages = new Set();

  const THUMB_W  = 200;   // display width of thumbnails, px
  const THUMB_Q  = 2;     // oversample factor for crisp text
  const MODAL_Q  = 2;     // oversample factor for modal

  function onFileSelected() {
    const file = document.getElementById('file-input').files[0];
    document.getElementById('file-name').textContent = file ? file.name : '';
    document.getElementById('upload-btn').disabled = !file;
  }

  function showLoading(text) {
    document.getElementById('loading-text').textContent = text;
    document.getElementById('loading').style.display = 'flex';
  }
  function hideLoading() {
    document.getElementById('loading').style.display = 'none';
  }

  async function uploadPDF() {
    const file = document.getElementById('file-input').files[0];
    if (!file) return;
    showLoading('Загрузка PDF...');
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/split/upload', { method: 'POST', body: fd });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      pdfToken = data.token;
      totalPages = data.page_count;
      document.getElementById('upload-section').style.display = 'none';
      document.getElementById('viewer-section').style.display = 'block';
      document.getElementById('viewer-title').textContent =
        `Выберите страницы-разделители (всего ${totalPages} стр.)`;
      await renderPages();
    } catch (e) {
      alert('Ошибка загрузки: ' + e.message);
    } finally {
      hideLoading();
    }
  }

  async function renderPages() {
    showLoading('Рендеринг страниц...');
    const grid = document.getElementById('pages-grid');
    grid.innerHTML = '';
    pdfDoc = await pdfjsLib.getDocument(`/split/pdf/${pdfToken}`).promise;
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);

      // High-quality thumbnail: render at THUMB_Q× the display size
      const baseVp = page.getViewport({ scale: 1 });
      const thumbScale = (THUMB_W / baseVp.width) * THUMB_Q;
      const viewport = page.getViewport({ scale: thumbScale });
      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width  = THUMB_W + 'px';
      canvas.style.height = (viewport.height / THUMB_Q) + 'px';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      const card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.page = i;
      card.innerHTML = `<span class="page-num">${i}</span><span class="page-check">✓</span>`;
      card.insertBefore(canvas, card.firstChild);

      // Long press (600ms) → open zoom modal; short click → toggle selection
      const startPress = () => { pressTimer = setTimeout(() => { longPressActive = true; openPageModal(i); }, 600); };
      const cancelPress = () => clearTimeout(pressTimer);
      card.addEventListener('mousedown', startPress);
      card.addEventListener('mouseup', cancelPress);
      card.addEventListener('mouseleave', cancelPress);
      card.addEventListener('touchstart', startPress, { passive: true });
      card.addEventListener('touchend', cancelPress);
      card.addEventListener('touchmove', cancelPress);
      card.addEventListener('contextmenu', (e) => e.preventDefault());
      card.addEventListener('click', () => {
        if (longPressActive) { longPressActive = false; return; }
        togglePage(i, card);
      });

      grid.appendChild(card);
    }
    hideLoading();
  }

  function togglePage(num, card) {
    if (selectedPages.has(num)) {
      selectedPages.delete(num);
      card.classList.remove('selected');
    } else {
      selectedPages.add(num);
      card.classList.add('selected');
    }
    updateSelectionInfo();
    if (currentModalPage !== null) updateModalToggleBtn();
  }

  function updateSelectionInfo() {
    const count = selectedPages.size;
    const info = document.getElementById('selection-info');
    const processBtn = document.getElementById('process-btn');
    const deleteBtn = document.getElementById('delete-btn');
    if (count === 0) {
      info.textContent = 'Не выбрано';
      processBtn.disabled = true;
      deleteBtn.disabled = true;
    } else {
      const sorted = [...selectedPages].sort((a, b) => a - b);
      info.textContent = `Выбрано ${count}: стр. ${sorted.join(', ')}`;
      processBtn.disabled = false;
      deleteBtn.disabled = false;
    }
  }

  async function deleteSelectedPages() {
    if (selectedPages.size === 0) return;
    const sorted = [...selectedPages].sort((a, b) => a - b);
    showLoading('Удаление страниц...');
    try {
      const res = await fetch(`/split/remove-pages/${pdfToken}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pages: sorted }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      totalPages = data.page_count;
      selectedPages.clear();
      updateSelectionInfo();
      document.getElementById('viewer-title').textContent =
        `Выберите страницы-разделители (всего ${totalPages} стр.)`;
      await renderPages();
    } catch (e) {
      alert('Ошибка: ' + e.message);
    } finally {
      hideLoading();
    }
  }

  async function processSplit() {
    if (selectedPages.size === 0) return;
    showLoading('Разделение и запуск OCR...');
    try {
      const sorted = [...selectedPages].sort((a, b) => a - b);
      const res = await fetch('/split/process', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: pdfToken, split_pages: sorted }),
      });
      if (!res.ok) throw new Error(await res.text());
      const records = await res.json();
      showResults(records);
    } catch (e) {
      alert('Ошибка: ' + e.message);
    } finally {
      hideLoading();
    }
  }

  function showResults(records) {
    document.getElementById('viewer-section').style.display = 'none';
    const tbody = document.getElementById('results-body');
    tbody.innerHTML = records.map(r => `
      <tr>
        <td>${r.id}</td>
        <td>${r.name}</td>
        <td><span class="badge badge-${r.status}">${r.status}</span></td>
      </tr>`).join('');
    document.getElementById('results-section').style.display = 'block';
  }

  /* ---- Modal ---- */

  async function openPageModal(pageNum) {
    if (!pdfDoc) return;
    currentModalPage = pageNum;
    const modal = document.getElementById('page-modal');
    modal.style.display = 'flex';

    // Update header info and nav buttons
    document.getElementById('modal-page-num').textContent =
      `Страница ${pageNum} из ${pdfDoc.numPages}`;
    document.getElementById('modal-prev').disabled = pageNum <= 1;
    document.getElementById('modal-next').disabled = pageNum >= pdfDoc.numPages;
    updateModalToggleBtn();

    showLoading('Открываю страницу...');
    try {
      const page = await pdfDoc.getPage(pageNum);
      const pixelRatio = window.devicePixelRatio || 1;
      const baseVp = page.getViewport({ scale: 1 });
      const maxW = window.innerWidth  * 0.88;
      const maxH = window.innerHeight * 0.78;
      // Render at MODAL_Q× screen resolution for crisp text
      const scale = Math.min(maxW / baseVp.width, maxH / baseVp.height) * pixelRatio * MODAL_Q;
      const viewport = page.getViewport({ scale });
      const canvas = document.getElementById('modal-canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      // Display at actual screen size (CSS undoes the quality oversample)
      canvas.style.width  = (viewport.width  / pixelRatio / MODAL_Q) + 'px';
      canvas.style.height = (viewport.height / pixelRatio / MODAL_Q) + 'px';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    } finally {
      hideLoading();
    }
  }

  function navigateModal(dir) {
    if (!pdfDoc || currentModalPage === null) return;
    const next = currentModalPage + dir;
    if (next >= 1 && next <= pdfDoc.numPages) openPageModal(next);
  }

  function toggleFromModal() {
    if (currentModalPage === null) return;
    const card = document.querySelector(`.page-card[data-page="${currentModalPage}"]`);
    togglePage(currentModalPage, card);
  }

  function updateModalToggleBtn() {
    const btn = document.getElementById('modal-toggle-btn');
    if (!btn || currentModalPage === null) return;
    const selected = selectedPages.has(currentModalPage);
    btn.textContent = selected ? '✕ Снять как разделитель' : '✓ Добавить как разделитель';
    btn.style.background = selected ? '#fee2e2' : '#eef2ff';
    btn.style.color      = selected ? '#991b1b' : '#4338ca';
  }

  function closeModal() {
    document.getElementById('page-modal').style.display = 'none';
    currentModalPage = null;
  }

  function onModalOverlayClick(e) {
    if (e.target === document.getElementById('page-modal')) closeModal();
  }

  window.addEventListener('scroll', () => {
    const btn = document.getElementById('scroll-top-btn');
    btn.style.display = window.scrollY > 300 ? 'block' : 'none';
  });

  document.addEventListener('keydown', e => {
    const modalOpen = document.getElementById('page-modal').style.display !== 'none';
    if (modalOpen) {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); navigateModal(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); navigateModal(1);  }
      if (e.key === 'Escape')     closeModal();
    }
  });

  /* ---- Reset ---- */

  function resetAll() {
    pdfToken = null;
    pdfDoc = null;
    totalPages = 0;
    currentModalPage = null;
    selectedPages.clear();
    document.getElementById('pages-grid').innerHTML = '';
    document.getElementById('results-body').innerHTML = '';
    document.getElementById('file-input').value = '';
    document.getElementById('file-name').textContent = '';
    document.getElementById('upload-btn').disabled = true;
    document.getElementById('upload-section').style.display = 'block';
    document.getElementById('viewer-section').style.display = 'none';
    document.getElementById('results-section').style.display = 'none';
  }
</script>
</body>
</html>
